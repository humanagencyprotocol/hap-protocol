name: Vercel credential check (temporary)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Who does this token belong to?
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -x
          npx --yes vercel@latest whoami --token "$VERCEL_TOKEN" || echo "WHOAMI FAILED"
          mkdir -p ctx && cd ctx
          npx --yes vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN" || echo "PULL FAILED"
          test -f .vercel/project.json && echo "LINK OK" || echo "NO LINK"
