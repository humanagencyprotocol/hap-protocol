name: Vercel credential check (temporary)
on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Build URL to resolve (read-only, nothing is promoted)
        required: true
        default: https://human-agency-protocol-2tp84m1i3-sublinme.vercel.app

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve a build URL to a deployment id
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
        run: |
          host="${DEPLOYMENT_URL#https://}"; host="${host#http://}"; host="${host%%/*}"
          echo "host: $host"
          curl -s -o deployment.json -w 'status=%{http_code}\n' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$host?teamId=$VERCEL_ORG_ID"

          python3 - <<'PY'
          import json, os
          d = json.load(open('deployment.json'))
          if 'error' in d:
              print('ERROR:', d['error'])
              raise SystemExit(1)
          print('id      :', d.get('uid') or d.get('id'))
          print('state   :', d.get('readyState') or d.get('status'))
          print('target  :', d.get('target'))
          print('project :', d.get('projectId') or (d.get('project') or {}).get('id'))
          print('matches :', (d.get('projectId') or '') == os.environ['VERCEL_PROJECT_ID'])
          print('commit  :', (d.get('meta') or {}).get('githubCommitSha', '')[:7])
          PY

          echo "--- what production serves right now ---"
          curl -sS -o project.json \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID"
          python3 - <<'PY'
          import json
          p = json.load(open('project.json'))
          prod = (p.get('targets') or {}).get('production') or {}
          d = json.load(open('deployment.json'))
          print('live id :', prod.get('id'))
          print('live sha:', (prod.get('meta') or {}).get('githubCommitSha', '')[:7])
          print('already live? :', prod.get('id') == d.get('uid'))
          PY
