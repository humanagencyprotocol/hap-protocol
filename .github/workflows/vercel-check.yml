name: Vercel build log (temporary)
on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Deployment to inspect
        required: true
        default: https://human-agency-protocol-aqvrf7wqs-sublinme.vercel.app

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Did Vercel actually build anything?
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
        run: |
          host="${DEPLOYMENT_URL#https://}"; host="${host%%/*}"
          id=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$host?teamId=$VERCEL_ORG_ID" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))')
          echo "deployment: $id"

          curl -sS -o ev.json -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v3/deployments/$id/events?builds=1&limit=200&teamId=$VERCEL_ORG_ID"

          python3 - <<'PY'
          import json
          raw = open('ev.json').read().strip()
          try:
              events = json.loads(raw)
              if isinstance(events, dict): events = events.get('events', [])
          except json.JSONDecodeError:
              events = [json.loads(l) for l in raw.splitlines() if l.strip()]
          print('--- build log ---')
          for e in events:
              t = e.get('text') or (e.get('payload') or {}).get('text') or ''
              if t.strip():
                  print('  ' + t.rstrip()[:150])
          PY
