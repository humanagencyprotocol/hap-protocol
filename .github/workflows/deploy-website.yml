name: Release (gated by HAP receipt)

# Dispatch ONLY, and dispatching proves nothing. Anyone with repository write
# access can start a workflow, and an agent with a shell on a developer machine
# can use that machine's `gh` credentials. The control point is `verify`: a
# dispatch without a valid receipt achieves nothing.
#
# Nothing is built here. The release activates a build that already exists, so
# the bytes served are exactly the bytes a human opened and looked at.
on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Immutable URL of the build to make live
        required: true
      receipt_id:
        description: Receipt proving human authority for this release
        required: true
      environment:
        description: Target environment (recorded; see the note in verify)
        required: false
        default: production

permissions:
  contents: read

env:
  AS_BASE: https://www.suveren.ai

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # The gate. No secrets and no privileges — it only reads a public receipt.
  # Anything it cannot prove, it refuses.
  # ───────────────────────────────────────────────────────────────────────────
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the receipt authorises this release
        env:
          RECEIPT_ID: ${{ inputs.receipt_id }}
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
          # A receipt is a bearer proof here — handed to a third party rather
          # than used in-process, which no other HAP integration does. Replaying
          # one re-releases the SAME build (a no-op), but an OLD receipt could
          # put old, possibly vulnerable, bytes back in front of users. The
          # window is what stops that.
          MAX_AGE_SECONDS: '1800'
        run: |
          set -euo pipefail
          echo "Receipt : $RECEIPT_ID"
          echo "Build   : $DEPLOYMENT_URL"

          http_code=$(curl -sS -o receipt.json -w '%{http_code}' \
            "$AS_BASE/api/as/public-receipt/$RECEIPT_ID" || true)
          if [ "$http_code" != "200" ]; then
            echo "::error::No such receipt (HTTP $http_code). Nothing released."
            exit 1
          fi

          python3 - <<'PY'
          import json, hashlib, sys, time, unicodedata, os

          r = json.load(open('receipt.json'))
          url = os.environ['DEPLOYMENT_URL']
          max_age = int(os.environ['MAX_AGE_SECONDS'])
          fail = []

          # 1. Genuine. NOTE: `signatureValid` is the Authority Server verifying
          #    its OWN signature. The public projection withholds the raw
          #    signature, so this is trust-in-issuer, not independent proof.
          #    Documented in content/0.5/review.md.
          if r.get('signatureValid') is not True:
              fail.append('signature not valid according to the issuer')

          # 2. It authorises a RELEASE — not a read, not something cheaper.
          if r.get('actionType') != 'release':
              fail.append(f"actionType is {r.get('actionType')!r}, expected 'release'")

          # 3. Issued under a deploy profile.
          if 'deploy@' not in (r.get('profileId') or ''):
              fail.append(f"profileId {r.get('profileId')!r} is not a deploy profile")

          # 4. Fresh.
          age = time.time() - float(r.get('timestamp') or 0)
          if age > max_age:
              fail.append(f'receipt is {int(age)}s old, limit {max_age}s')
          if age < -300:
              fail.append('receipt timestamp is in the future')

          # 5. THE check: it binds THIS build. Canonicalisation is the profile's
          #    content_binding kind:"text" — NFC, LF, trim — reimplemented here
          #    on purpose. A verifier must not depend on the software it is
          #    verifying.
          binding = r.get('contentBinding') or {}
          if binding.get('kind') != 'text':
              fail.append(f'unsupported contentBinding {binding!r}')
          else:
              canon = unicodedata.normalize('NFC', url).replace('\r\n', '\n').replace('\r', '\n').strip()
              expected = 'sha256:' + hashlib.sha256(canon.encode('utf-8')).hexdigest()
              if r.get('contentHash') != expected:
                  fail.append('receipt does NOT bind this build — it authorises different bytes')

          # NOT CHECKED, and not to be claimed: repository, environment and
          # pipeline live in executionContext, which the public projection
          # redacts. Closing this needs the declared-disclosure work in
          # content/0.5/review.md.

          if fail:
              for f in fail:
                  print(f'::error::{f}')
              sys.exit(1)

          who = (r.get('identity') or {}).get('name', 'unknown')
          when = time.strftime('%Y-%m-%d %H:%M:%SZ', time.gmtime(r['timestamp']))
          print(f'Receipt verified. Released by {who} at {when}.')
          PY

  # ───────────────────────────────────────────────────────────────────────────
  # Runs only if verify passed. The Vercel token lives in the `production`
  # environment, so a workflow that skipped verify could not reach it.
  # ───────────────────────────────────────────────────────────────────────────
  release:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Make this build live
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          # Establish project context first. This job deliberately does not check
          # out the repository — nothing is built here — so there is no `.vercel`
          # link on disk and the CLI cannot tell which team or project a bare
          # deployment URL belongs to. It answered "User not found (404)".
          #
          # `vercel pull` reads VERCEL_ORG_ID / VERCEL_PROJECT_ID from the
          # environment and writes that link into an empty directory, which is
          # all the CLI needs. Still no checkout, still no build.
          mkdir -p .vercel-context && cd .vercel-context
          npx --yes vercel@latest pull --yes \
            --environment=production --token "$VERCEL_TOKEN"

          # `promote` re-points production at bytes that already exist. Nothing
          # is built, so nothing can diverge from what was approved.
          npx --yes vercel@latest promote "${{ inputs.deployment_url }}" \
            --token "$VERCEL_TOKEN" --yes

      - name: Summary
        run: |
          {
            echo "### Released under human authority"
            echo ""
            echo "- build: ${{ inputs.deployment_url }}"
            echo "- receipt: ${{ env.AS_BASE }}/r/${{ inputs.receipt_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
